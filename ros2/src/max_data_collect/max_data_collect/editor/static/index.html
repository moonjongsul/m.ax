<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.AX Dataset Editor</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #23272f; --line: #323845;
    --fg: #e6e9ef; --dim: #9aa3b2; --accent: #5aa9ff; --good: #4ec98a;
    --warn: #e5b567; --bad: #e5697a; --seg: #7c6bd8;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:6px;
           padding:7px 13px; cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06101d; font-weight:600; }
  button.danger  { border-color:var(--bad); color:var(--bad); }
  input, select, textarea { background:var(--panel2); border:1px solid var(--line);
                            border-radius:6px; padding:7px 9px; width:100%; font-size:14px; }
  textarea { resize: vertical; }

  #layout { display:grid; grid-template-columns:300px 1fr var(--insp, 560px); height:100vh; }
  .col { overflow-y:auto; min-width:0; }
  /* #main must not scroll: the timeline flexes to fill whatever the videos
     leave, so every channel row fits on screen at once. */
  #main.col { overflow:hidden; }
  #sidebar { background:var(--panel); border-right:1px solid var(--line); }
  /* Split vertically; each pane scrolls on its own so the subtask buttons
     stay put however long the segment list gets. */
  #inspector { background:var(--panel); border-left:1px solid var(--line);
               display:grid; grid-template-columns:1fr 1fr; min-width:0;
               height:100vh; overflow:hidden; }
  #inspector .pane { overflow-y:auto; min-width:0; padding:13px; }
  #insSegments { border-left:1px solid var(--line); }
  /* Narrow windows cannot afford two columns: stack them back into one. */
  @media (max-width: 1500px) {
    #layout { grid-template-columns:270px 1fr 400px; }
    #inspector { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    #insSegments { border-left:0; border-top:1px solid var(--line); }
  }
  #main { display:flex; flex-direction:column; padding:8px; gap:7px; height:100vh; }

  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--dim); margin:16px 12px 7px; }
  .ep { padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .ep:hover { background:var(--panel2); }
  .ep.active { background:#2b3446; border-left:3px solid var(--accent); }
  .ep .t { display:flex; justify-content:space-between; gap:6px; }
  .ep .s { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:9px; border:1px solid var(--line); }
  .badge.ok  { color:var(--good); border-color:var(--good); }
  .badge.rej { color:var(--bad);  border-color:var(--bad); }

  /* Videos are capped so the plots get the rest of the column. */
  #videos { display:flex; gap:8px; flex:0 0 auto; height:24vh; min-height:120px; }
  .vwrap { flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
  .vwrap label { display:block; font-size:12px; color:var(--dim); margin-bottom:2px; flex:0 0 auto; }
  video { width:100%; min-height:0; flex:1 1 auto; object-fit:contain;
          background:#000; border-radius:6px; display:block; }

  #timeline { background:var(--panel); border:1px solid var(--line); border-radius:6px;
              padding:8px; flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  /* No scrollbar: rows are sized to the space this box actually has. */
  #plotScroll { flex:1 1 auto; min-height:0; overflow:hidden; }
  canvas { display:block; width:100%; cursor:crosshair; }
  #chanToggles { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; flex:0 0 auto; }
  .chip { font-size:12px; padding:3px 9px; border-radius:11px;
          border:1px solid var(--c, var(--line)); color:var(--c, var(--fg));
          background:transparent; }
  .chip.off { opacity:.4; border-color:var(--line); color:var(--dim);
              text-decoration:line-through; }
  #transport { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:7px; flex:0 0 auto; }
  .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }

  .field { margin-bottom:9px; }
  .field > label { display:block; font-size:13px; color:var(--dim); margin-bottom:4px; }
  .row { display:flex; gap:6px; align-items:center; }
  .seg { border:1px solid var(--line); border-left:4px solid var(--seg);
         border-radius:6px; padding:9px; margin-bottom:8px; background:var(--panel2); }
  .seg.sel { border-color:var(--accent); border-left-color:var(--accent); }
  .seg .hd { display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin-bottom:6px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
           background:var(--panel2); border:1px solid var(--line); border-radius:7px;
           padding:10px 18px; font-size:14px; opacity:0; transition:opacity .2s;
           pointer-events:none; z-index:9; }
  #toast.on { opacity:1; }
  .hint { color:var(--dim); font-size:13px; }
  .segnums { display:flex; gap:5px; margin-top:5px; }
  .segnums label { flex:1 1 0; min-width:0; font-size:11px; color:var(--dim); }
  .segnums input { margin-top:2px; padding:5px 6px; font-size:13px; }
  /* One button per row in the narrower pane: the expanded prompt preview
     needs the width more than the grid does. */
  #subtaskBtns { display:flex; flex-direction:column; gap:5px; }
  #subtaskBtns button { padding:5px 10px; font-size:13px; text-align:left; width:100%; }
  #subtaskBtns button .k { color:var(--dim); font-size:11px; margin-right:5px; }
  #subtaskBtns button .p { display:block; color:var(--dim); font-size:11.5px; }
  .dirty { color:var(--warn); }
  input:disabled { opacity:.45; cursor:not-allowed; }
  /* A score saved before the step changed (0.25, 0.5, ...) is still a valid
     score; the step only drives the arrow keys, so do not flag it. */
  .segnums input:invalid, #fScore:invalid { outline:none; box-shadow:none; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar" class="col">
    <h2>Dataset Root</h2>
    <div style="padding:0 12px">
      <input id="rootPath" placeholder="/path/to/datasets" spellcheck="false">
      <button id="btnRoot" style="width:100%; margin-top:6px">폴더 열기</button>
    </div>
    <h2>Dataset</h2>
    <div style="padding:0 12px"><select id="dsSelect"></select></div>
    <div id="dsStats" class="hint" style="padding:8px 12px"></div>
    <h2>Episodes</h2>
    <div style="padding:0 12px 8px"><input id="epFilter" placeholder="filter / unlabeled / rejected"></div>
    <div id="epList"></div>
  </div>

  <div id="main" class="col">
    <div id="videos"></div>
    <div id="timeline">
      <div id="plotScroll"><canvas id="plot"></canvas></div>
      <div id="chanToggles"></div>
      <div id="transport">
        <button id="btnPlay">▶ Play</button>
        <label class="hint" style="display:flex;align-items:center;gap:4px;cursor:pointer">
          <input id="fAutoplay" type="checkbox" checked style="width:auto"> 자동재생</label>
        <span class="mono" id="frameLabel">–</span>
        <span class="hint">speed</span>
        <select id="rate" style="width:auto">
          <option>0.25</option><option>0.5</option><option selected>1</option>
          <option>2</option><option>4</option>
        </select>
        <button id="btnIn">Set In [I]</button>
        <button id="btnOut">Set Out [O]</button>
        <button id="btnSplit">Split [S]</button>
        <button id="btnSuggest">Auto-segment</button>
        <span class="hint">nudge</span>
        <button id="btnGrowA" title="move selected segment start earlier">[⇤</button>
        <button id="btnShrinkA" title="move selected segment start later">[⇥</button>
        <button id="btnShrinkB" title="move selected segment end earlier">⇤]</button>
        <button id="btnGrowB" title="move selected segment end later">⇥]</button>
        <label class="hint" style="display:flex;align-items:center;gap:4px;cursor:pointer"
               title="dragging a shared boundary moves the neighbouring segment with it">
          <input id="fRipple" type="checkbox" checked style="width:auto"> ripple</label>
        <span class="hint" id="kbdHint">J/L step · K play · ←/→ ±10 · Del remove · drag edges or [ ] { } to resize</span>
      </div>
    </div>
    <div id="keyframes" class="hint" style="flex:0 0 auto"></div>
  </div>

  <div id="inspector">
    <!-- Two independently scrolling panes: a long segment list must never
         push the subtask buttons out of reach. -->
    <div id="insEpisode" class="pane">
      <div class="row" style="justify-content:space-between">
        <strong id="epTitle">No episode</strong>
        <span id="dirtyFlag" class="dirty"></span>
      </div>
      <div class="field"><label>Main prompt</label><textarea id="fPrompt" rows="3"></textarea></div>
      <div class="row">
        <div class="field" style="flex:1"><label>Episode score (0–1)</label>
          <input id="fScore" type="number" min="0" max="1" step="0.2" placeholder="1"></div>
        <div class="field" style="flex:1"><label>Reject</label>
          <div><input id="fReject" type="checkbox" style="width:auto"> exclude</div></div>
      </div>
      <div class="field" style="margin-bottom:4px">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer"
               title="첫 segment 시작 ~ 마지막 segment 끝으로 trim 을 자동 설정">
          <input id="fTrimAuto" type="checkbox" checked style="width:auto">
          Trim to segments <span id="trimHint" class="hint"></span></label>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>Trim start</label><input id="fTrimA" type="number" min="0"></div>
        <div class="field" style="flex:1"><label>Trim end</label><input id="fTrimB" type="number" min="0"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="fNotes" rows="2"></textarea></div>
      <div class="row" style="margin-bottom:10px">
        <button id="btnSave" class="primary" style="flex:1">Save [Ctrl+S]</button>
        <button id="btnReload">Revert</button>
        <button id="btnCopyPrev" title="Copy segments+prompt from previous episode">⧉ Prev</button>
      </div>
      <h2 style="margin-left:0">Subtask</h2>
      <div class="row" id="slotRow">
        <div class="field" style="flex:1"><label>Object</label><select id="fObject"></select></div>
        <div class="field" style="flex:1"><label>Target</label><select id="fTarget"></select></div>
      </div>
      <div id="subtaskBtns"></div>
      <details style="margin:10px 0">
        <summary class="hint" style="cursor:pointer">Free-text vocabulary (fallback)</summary>
        <div class="field" style="margin-top:6px"><label>Label vocabulary (comma separated)</label>
          <input id="fVocab" placeholder="reach, grasp, move, place"></div>
      </details>
    </div>
    <div id="insSegments" class="pane">
      <h2 style="margin:0 0 7px">Segments <span id="segCount" class="hint"></span></h2>
      <div id="segList"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<datalist id="vocabList"></datalist>
<script src="/app.js"></script>
</body>
</html>
